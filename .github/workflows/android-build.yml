name: Build SharpDroid APK (reserve-range fix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repository (patch)
        uses: actions/checkout@v4
        with:
          path: recipe

      - name: Check out SharpDroid and its submodules
        uses: actions/checkout@v4
        with:
          repository: mircowuffwuff/sharpdroid
          ref: 04be4fd260b8b2547e281056398fac390e80278c
          path: sharpdroid
          submodules: recursive

      - name: Check out the Android-supported SharpEmu fork
        uses: actions/checkout@v4
        with:
          repository: mircowuffwuff/sharpemu
          ref: f44351ffdb46d11752c197768c77e0b81eff399f
          path: sharpemu
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install the Android toolchain pinned by SharpDroid
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
          {
            echo "SHARPDROID_SDK=$ANDROID_HOME"
            echo "SHARPDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865"
            echo "SHARPDROID_CMAKE=$ANDROID_HOME/cmake/3.22.1/bin"
            echo "SHARPDROID_JDK=$JAVA_HOME"
            echo "SHARPDROID_DOTNET=$DOTNET_ROOT"
            echo "SHARPDROID_SHARPEMU=$GITHUB_WORKSPACE/sharpemu"
          } >> "$GITHUB_ENV"

      - name: Apply the reserve-virtual-range patch
        working-directory: sharpemu
        shell: bash
        run: |
          set -euo pipefail
          git apply --check ../recipe/fix-reserve-virtual-range.patch
          git apply ../recipe/fix-reserve-virtual-range.patch
          git diff --check
          git status --short

      - name: Build and package the patched SharpEmu payload
        working-directory: sharpdroid
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-build.py --branch android \
            --name "SharpEmu Android (reserve-range fix)" \
            --notes "Android SharpEmu build with the reserve-virtual-range fallback patch."
          BUILD_DIR="$(find build/builds -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$BUILD_DIR"
          test -f "$BUILD_DIR/SharpEmu"
          test -d "$BUILD_DIR/plugins"
          echo "SHARPEMU_BUILD_DIR=$GITHUB_WORKSPACE/sharpdroid/$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Packaged SharpEmu payload: $BUILD_DIR"

      - name: Build the complete Android APK
        working-directory: sharpdroid
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build.py --sharpemu "$SHARPEMU_BUILD_DIR"
          APK="$(find build -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK_PATH=$GITHUB_WORKSPACE/sharpdroid/$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sharpdroid-vmfix-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
